<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a1b20">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Gym">
    <title>Gym</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <script>
      (() => {
        const root = document.documentElement;
        const isStandalone =
          window.navigator.standalone === true ||
          window.matchMedia("(display-mode: standalone)").matches;

        function updateAppHeight() {
          const height = isStandalone && window.screen.height
            ? window.screen.height
            : window.visualViewport
              ? window.visualViewport.height
              : window.innerHeight;
          root.style.setProperty("--app-height", `${height}px`);
        }

        updateAppHeight();
        window.addEventListener("resize", updateAppHeight);
        window.addEventListener("orientationchange", updateAppHeight);
        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", updateAppHeight);
        }
      })();
    </script>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #1a1b20;
        color: #fff;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --app-height: 100dvh;
        --nav-pill-height: clamp(54px, 6.8dvh, 68px);
      }

      * {
        box-sizing: border-box;
        -webkit-user-select: none;
        user-select: none;
      }

      html,
      body {
        width: 100%;
        height: var(--app-height);
        min-width: 320px;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
      }

      body {
        background: linear-gradient(135deg, #000 0%, #1a1b20 42%);
      }

      .gym-page {
        position: relative;
        width: 100%;
        height: 100%;
      }

      .topbar {
        position: absolute;
        top: calc(24px + var(--safe-top));
        right: 24px;
        left: 24px;
        display: flex;
        justify-content: flex-end;
      }

      .page-heading {
        position: absolute;
        top: calc(112px + var(--safe-top));
        right: 24px;
        left: 24px;
        padding-bottom: 9px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      }

      .page-title {
        margin: 0;
        font-size: clamp(22px, 5.6vw, 26px);
        font-weight: 550;
        letter-spacing: -0.025em;
        line-height: 1.2;
      }

      .more-button {
        display: grid;
        width: 44px;
        height: 44px;
        padding: 0;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        background: rgba(54, 55, 60, 0.76);
        color: #fff;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.24);
        -webkit-backdrop-filter: blur(24px) saturate(160%);
        backdrop-filter: blur(24px) saturate(160%);
        -webkit-tap-highlight-color: transparent;
      }

      .more-button svg {
        width: 20px;
        height: 20px;
      }

      .more-button:focus-visible {
        outline: 2px solid rgba(255, 255, 255, 0.8);
        outline-offset: 3px;
      }

      .bottom-nav {
        position: fixed;
        z-index: 10;
        right: 0;
        bottom: max(12px, calc(var(--safe-bottom) - 12px));
        left: 0;
        display: flex;
        width: 100%;
        height: calc(var(--nav-pill-height) + 10px);
        align-items: center;
        justify-content: center;
        padding: 0 5vw 2px;
        pointer-events: none;
      }

      .nav-pill {
        display: flex;
        width: min(100%, 860px);
        height: var(--nav-pill-height);
        align-items: center;
        justify-content: space-between;
        gap: 4px;
        padding: 4px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 999px;
        background: rgba(23, 24, 28, 0.86);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.4);
        -webkit-backdrop-filter: blur(24px) saturate(160%);
        backdrop-filter: blur(24px) saturate(160%);
        pointer-events: auto;
      }

      .nav-item {
        display: flex;
        min-width: 0;
        height: calc(var(--nav-pill-height) - 10px);
        padding: 0;
        align-items: center;
        justify-content: center;
        flex: 1 1 0;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: rgba(255, 255, 255, 0.92);
        -webkit-tap-highlight-color: transparent;
      }

      .nav-item[aria-current="page"] {
        background: rgba(255, 255, 255, 0.2);
        color: #fff;
      }

      .nav-item:disabled {
        cursor: default;
      }

      .nav-item svg {
        width: clamp(24px, 3.2dvh, 30px);
        height: clamp(24px, 3.2dvh, 30px);
      }

      .nav-item[aria-current="page"] svg {
        width: clamp(26px, 3.5dvh, 32px);
        height: clamp(26px, 3.5dvh, 32px);
      }

      .nav-item:focus-visible {
        outline: 2px solid rgba(255, 255, 255, 0.9);
        outline-offset: -2px;
      }

      .nav-item:disabled:focus-visible {
        outline: none;
      }

    </style>
  </head>
  <body>
    <main class="gym-page" aria-label="Page Gym">
      <header class="topbar">
        <button class="more-button" type="button" aria-label="Plus d’options">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <circle cx="5" cy="12" r="1.7" />
            <circle cx="12" cy="12" r="1.7" />
            <circle cx="19" cy="12" r="1.7" />
          </svg>
        </button>
      </header>
      <section class="page-heading" aria-labelledby="page-title">
        <h1 class="page-title" id="page-title">Aujourd’hui</h1>
      </section>
    </main>
    <nav class="bottom-nav" aria-label="Navigation principale">
      <div class="nav-pill">
        <a class="nav-item" href="./" aria-current="page" aria-label="Gym, page actuelle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 8.5v7M3.5 10v4M18 8.5v7m2.5-5v4M6 12h12" />
          </svg>
        </a>
        <button class="nav-item" type="button" disabled aria-label="Accueil">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z" />
          </svg>
        </button>
        <button class="nav-item" type="button" disabled aria-label="Accueil">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z" />
          </svg>
        </button>
        <button class="nav-item" type="button" disabled aria-label="Accueil">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z" />
          </svg>
        </button>
        <button class="nav-item" type="button" disabled aria-label="Accueil">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z" />
          </svg>
        </button>
      </div>
    </nav>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch((error) => {
            console.error("Impossible d'enregistrer le service worker :", error);
          });
        });
      }

      document.addEventListener("dblclick", (event) => {
        event.preventDefault();
      }, { passive: false });

      ["gesturestart", "gesturechange", "gestureend"].forEach((eventName) => {
        document.addEventListener(eventName, (event) => {
          event.preventDefault();
        }, { passive: false });
      });
    </script>
  </body>
</html>
