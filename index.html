<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1a1b20">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Gym">
    <title>Gym</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #1a1b20;
        color: #fff;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-width: 320px;
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        background: linear-gradient(135deg, #000 0%, #1a1b20 42%);
      }

      .gym-page {
        position: relative;
        min-height: 100vh;
        min-height: 100dvh;
      }

      .topbar {
        position: absolute;
        top: calc(24px + var(--safe-top));
        right: 24px;
        left: 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .page-title {
        margin: 0;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.04em;
      }

      .more-button {
        display: grid;
        width: 48px;
        height: 48px;
        padding: 0;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.24);
        color: #fff;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.24);
        -webkit-backdrop-filter: blur(24px) saturate(160%);
        backdrop-filter: blur(24px) saturate(160%);
        -webkit-tap-highlight-color: transparent;
      }

      .more-button svg {
        width: 22px;
        height: 22px;
      }

      .more-button:focus-visible {
        outline: 2px solid rgba(255, 255, 255, 0.8);
        outline-offset: 3px;
      }

      .bottom-nav {
        position: fixed;
        z-index: 1;
        right: 50%;
        bottom: calc(18px + var(--safe-bottom));
        display: flex;
        width: 76px;
        height: 76px;
        align-items: center;
        justify-content: center;
        padding: 5px;
        transform: translateX(50%);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 25px;
        background: rgba(255, 255, 255, 0.24);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.24);
        -webkit-backdrop-filter: blur(24px) saturate(160%);
        backdrop-filter: blur(24px) saturate(160%);
      }

      .nav-item {
        display: flex;
        width: 64px;
        height: 64px;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 21px;
        background: rgba(12, 13, 16, 0.68);
        color: #fff;
        -webkit-tap-highlight-color: transparent;
      }

      .nav-item svg {
        width: 38px;
        height: 38px;
      }

      .nav-item:focus-visible {
        outline: 2px solid rgba(255, 255, 255, 0.8);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main class="gym-page" aria-label="Page Gym">
      <header class="topbar">
        <h1 class="page-title">Aujourd’hui</h1>
        <button class="more-button" type="button" aria-label="Plus d’options">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <circle cx="5" cy="12" r="1.7" />
            <circle cx="12" cy="12" r="1.7" />
            <circle cx="19" cy="12" r="1.7" />
          </svg>
        </button>
      </header>
    </main>
    <nav class="bottom-nav" aria-label="Navigation principale">
      <a class="nav-item" href="./" aria-current="page" aria-label="Gym, page actuelle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 8.5v7M3.5 10v4M18 8.5v7m2.5-5v4M6 12h12" />
        </svg>
      </a>
    </nav>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch((error) => {
            console.error("Impossible d'enregistrer le service worker :", error);
          });
        });
      }
    </script>
  </body>
</html>
