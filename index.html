<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a1b20">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Gym">
    <title>Gym</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #1a1b20;
        color: #fff;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
      }

      * {
        box-sizing: border-box;
        -webkit-user-select: none;
        user-select: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        min-width: 320px;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        background: linear-gradient(135deg, #000 0%, #1a1b20 42%);
      }

      .gym-page {
        position: relative;
        min-height: 100vh;
        min-height: 100dvh;
      }

      .topbar {
        position: absolute;
        top: calc(24px + var(--safe-top));
        right: 24px;
        left: 24px;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
      }

      .page-title {
        margin: 0;
        padding-top: 12px;
        font-size: clamp(32px, 8vw, 38px);
        font-weight: 700;
        letter-spacing: -0.04em;
        line-height: 1.1;
      }

      .more-button {
        display: grid;
        width: 48px;
        height: 48px;
        padding: 0;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.24);
        color: #fff;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.24);
        -webkit-backdrop-filter: blur(24px) saturate(160%);
        backdrop-filter: blur(24px) saturate(160%);
        -webkit-tap-highlight-color: transparent;
      }

      .more-button svg {
        width: 22px;
        height: 22px;
      }

      .more-button:focus-visible {
        outline: 2px solid rgba(255, 255, 255, 0.8);
        outline-offset: 3px;
      }

      .bottom-nav {
        position: fixed;
        z-index: 1;
        right: 0;
        bottom: 0;
        left: 0;
        display: flex;
        width: 100%;
        height: calc(68px + var(--safe-bottom));
        align-items: center;
        justify-content: center;
        padding: 0 16px calc(8px + var(--safe-bottom));
        pointer-events: none;
      }

      .nav-pill {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        padding: 7px;
        border: 1px solid rgba(255, 255, 255, 0.45);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.88);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.24);
        -webkit-backdrop-filter: blur(24px) saturate(160%);
        backdrop-filter: blur(24px) saturate(160%);
        pointer-events: auto;
      }

      .nav-item {
        display: grid;
        width: 40px;
        height: 40px;
        padding: 0;
        place-items: center;
        flex: 0 0 40px;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: #55565b;
        -webkit-tap-highlight-color: transparent;
      }

      .nav-item[aria-current="page"] {
        color: #1a1b20;
      }

      .nav-item:disabled {
        opacity: 0.72;
      }

      .nav-item svg {
        width: 25px;
        height: 25px;
      }

      .nav-item[aria-current="page"] svg {
        width: 28px;
        height: 28px;
        stroke-width: 2.8;
      }

      .nav-item:focus-visible {
        outline: 2px solid #1a1b20;
        outline-offset: 1px;
      }

      .nav-item:disabled:focus-visible {
        outline: none;
      }

      /* Keep the five-icon pill compact on narrow phone screens. */
      @media (max-width: 360px) {
        .nav-pill {
          gap: 2px;
          padding: 6px;
        }

        .nav-item {
          width: 38px;
          height: 38px;
          flex-basis: 38px;
        }
      }
    </style>
  </head>
  <body>
    <main class="gym-page" aria-label="Page Gym">
      <header class="topbar">
        <h1 class="page-title">Aujourd’hui</h1>
        <button class="more-button" type="button" aria-label="Plus d’options">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <circle cx="5" cy="12" r="1.7" />
            <circle cx="12" cy="12" r="1.7" />
            <circle cx="19" cy="12" r="1.7" />
          </svg>
        </button>
      </header>
    </main>
    <nav class="bottom-nav" aria-label="Navigation principale">
      <div class="nav-pill">
        <a class="nav-item" href="./" aria-current="page" aria-label="Gym, page actuelle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 8.5v7M3.5 10v4M18 8.5v7m2.5-5v4M6 12h12" />
          </svg>
        </a>
        <button class="nav-item" type="button" disabled aria-label="Accueil">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z" />
          </svg>
        </button>
        <button class="nav-item" type="button" disabled aria-label="Accueil">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z" />
          </svg>
        </button>
        <button class="nav-item" type="button" disabled aria-label="Accueil">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z" />
          </svg>
        </button>
        <button class="nav-item" type="button" disabled aria-label="Accueil">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z" />
          </svg>
        </button>
      </div>
    </nav>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch((error) => {
            console.error("Impossible d'enregistrer le service worker :", error);
          });
        });
      }

      document.addEventListener("dblclick", (event) => {
        event.preventDefault();
      }, { passive: false });

      ["gesturestart", "gesturechange", "gestureend"].forEach((eventName) => {
        document.addEventListener(eventName, (event) => {
          event.preventDefault();
        }, { passive: false });
      });
    </script>
  </body>
</html>
